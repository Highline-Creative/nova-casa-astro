backend:
  name: git-gateway
  branch: main
  identity_url: https://novacasadubai.com/.netlify/identity
  gateway_url: https://novacasadubai.com/.netlify/functions

publish_mode: editorial_workflow

media_folder: "public/assets/img/properties"
public_folder: "/assets/img/properties"

collections:
  - name: "properties-en"
    label: "Properties (EN)"
    folder: "src/content/properties/en"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: title
    fields:
      - { label: "Display order", name: "order", widget: "number", default: 99 }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string" }
      - { label: "Community", name: "community", widget: "string" }
      - { label: "Building", name: "building", widget: "string", required: false }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Price", name: "price", widget: "string" }
      - { label: "Price note (e.g. Ref., Freehold)", name: "priceNote", widget: "string", required: false }
      - { label: "Type", name: "type", widget: "string" }
      - { label: "Purpose (For Sale / For Rent)", name: "purpose", widget: "string" }
      - { label: "Bedrooms", name: "beds", widget: "number" }
      - { label: "Bathrooms", name: "baths", widget: "number" }
      - { label: "Size", name: "size", widget: "string" }
      - { label: "Parking", name: "parking", widget: "string", required: false }
      - { label: "Floor", name: "floor", widget: "string", required: false }
      - { label: "View", name: "view", widget: "string", required: false }
      - { label: "Balcony", name: "balcony", widget: "string", required: false }
      - { label: "Furnishing", name: "furnishing", widget: "string" }
      - { label: "Status", name: "status", widget: "string", required: false }
      - { label: "Video (YouTube embed URL)", name: "videoUrl", widget: "string", required: false }
      - { label: "Photos", name: "images", widget: "list", field: { label: "Photo", name: "image", widget: "image" } }
      - { label: "Description (paragraphs)", name: "description", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
      - { label: "Features", name: "features", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
      - { label: "Amenities", name: "amenities", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
      - { label: "Nearby places", name: "nearby", widget: "list", required: false, field: { label: "Item", name: "item", widget: "string" } }

  - name: "properties-pt"
    label: "Properties (PT-BR)"
    folder: "src/content/properties/pt-br"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: title
    fields:
      - { label: "Display order", name: "order", widget: "number", default: 99 }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string" }
      - { label: "Community", name: "community", widget: "string" }
      - { label: "Building", name: "building", widget: "string", required: false }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Price", name: "price", widget: "string" }
      - { label: "Price note (e.g. Ref., Freehold)", name: "priceNote", widget: "string", required: false }
      - { label: "Type", name: "type", widget: "string" }
      - { label: "Purpose (Venda / Aluguel)", name: "purpose", widget: "string" }
      - { label: "Bedrooms", name: "beds", widget: "number" }
      - { label: "Bathrooms", name: "baths", widget: "number" }
      - { label: "Size", name: "size", widget: "string" }
      - { label: "Parking", name: "parking", widget: "string", required: false }
      - { label: "Floor", name: "floor", widget: "string", required: false }
      - { label: "View", name: "view", widget: "string", required: false }
      - { label: "Balcony", name: "balcony", widget: "string", required: false }
      - { label: "Furnishing", name: "furnishing", widget: "string" }
      - { label: "Status", name: "status", widget: "string", required: false }
      - { label: "Video (YouTube embed URL)", name: "videoUrl", widget: "string", required: false }
      - { label: "Photos", name: "images", widget: "list", field: { label: "Photo", name: "image", widget: "image" } }
      - { label: "Description (paragraphs)", name: "description", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
      - { label: "Features", name: "features", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
      - { label: "Amenities", name: "amenities", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
      - { label: "Nearby places", name: "nearby", widget: "list", required: false, field: { label: "Item", name: "item", widget: "string" } }

  - name: "faq-en"
    label: "FAQ (EN)"
    folder: "src/content/faq/en"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: question
    fields:
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["buying", "fees", "renting", "legal", "investing"]
      - { label: "Order within category", name: "order", widget: "number" }
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "text" }
      - { label: "Open by default?", name: "openByDefault", widget: "boolean", required: false, default: false }

  - name: "faq-pt"
    label: "FAQ (PT-BR)"
    folder: "src/content/faq/pt-br"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: question
    fields:
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["por-que-dubai", "comprando", "impostos-vistos", "investindo"]
      - { label: "Order within category", name: "order", widget: "number" }
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "text" }
      - { label: "Open by default?", name: "openByDefault", widget: "boolean", required: false, default: false }

  - name: "geral"
    label: "General Site Content"
    extension: "json"
    format: "json"
    files:
      - file: "src/content/business.json"
        label: "Business Details"
        name: "business"
        fields:
          - { label: "Phone (display)", name: "phone", widget: "string" }
          - { label: "Phone (tel: link)", name: "phoneHref", widget: "string" }
          - { label: "WhatsApp (numbers only, with country code)", name: "whatsappNumber", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "RERA No.", name: "rera", widget: "string" }
          - { label: "YouTube URL", name: "youtubeUrl", widget: "string" }
          - { label: "Bayut URL", name: "bayutUrl", widget: "string" }
          - { label: "DLD verification URL", name: "dldVerifyUrl", widget: "string" }
          - { label: "Agent name", name: "agentName", widget: "string" }

      - file: "src/content/site/en.json"
        label: "Site Text — English"
        name: "siteEn"
        fields:
          - { label: "Hero — eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero — title", name: "heroTitle", widget: "string" }
          - { label: "Hero — paragraph", name: "heroLede", widget: "text" }
          - { label: "Hero — background image", name: "heroImage", widget: "image" }
          - { label: "Hero — image alt text", name: "heroImageAlt", widget: "string" }
          - { label: "Stat — number of listings", name: "statListings", widget: "string" }
          - { label: "Stat — price range", name: "statPriceRange", widget: "string" }
          - { label: "Trust badges", name: "trustItems", widget: "list", field: { label: "Badge", name: "item", widget: "string" } }
          - { label: "Properties — eyebrow", name: "propertiesEyebrow", widget: "string" }
          - { label: "Properties — title", name: "propertiesTitle", widget: "string" }
          - { label: "Properties — paragraph", name: "propertiesLede", widget: "text" }
          - { label: "Agent role", name: "agentRole", widget: "string" }
          - { label: "Agent bio", name: "agentBio", widget: "text" }
          - { label: "About — eyebrow", name: "aboutEyebrow", widget: "string" }
          - { label: "About — title", name: "aboutTitle", widget: "string" }
          - { label: "About — paragraphs", name: "aboutParagraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
          - { label: "Services — eyebrow", name: "servicesEyebrow", widget: "string" }
          - { label: "Services — title", name: "servicesTitle", widget: "string" }
          - { label: "Services — paragraph", name: "servicesLede", widget: "text" }
          - label: "Services — items"
            name: "services"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "FAQ teaser — eyebrow", name: "faqTeaserEyebrow", widget: "string" }
          - { label: "FAQ teaser — title", name: "faqTeaserTitle", widget: "string" }
          - { label: "FAQ teaser — paragraph", name: "faqTeaserLede", widget: "text" }
          - { label: "Contact — eyebrow", name: "contactEyebrow", widget: "string" }
          - { label: "Contact — title", name: "contactTitle", widget: "string" }
          - { label: "Contact — paragraph", name: "contactLede", widget: "text" }
          - { label: "Footer — brand tagline", name: "footerTagline", widget: "text" }

      - file: "src/content/site/pt-br.json"
        label: "Site Text — Portuguese"
        name: "sitePt"
        fields:
          - { label: "Hero — eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero — title", name: "heroTitle", widget: "string" }
          - { label: "Hero — paragraph", name: "heroLede", widget: "text" }
          - { label: "Hero — background image", name: "heroImage", widget: "image" }
          - { label: "Hero — image alt text", name: "heroImageAlt", widget: "string" }
          - { label: "Stat — number of listings", name: "statListings", widget: "string" }
          - { label: "Stat — price range", name: "statPriceRange", widget: "string" }
          - { label: "Trust badges", name: "trustItems", widget: "list", field: { label: "Badge", name: "item", widget: "string" } }
          - { label: "Properties — eyebrow", name: "propertiesEyebrow", widget: "string" }
          - { label: "Properties — title", name: "propertiesTitle", widget: "string" }
          - { label: "Properties — paragraph", name: "propertiesLede", widget: "text" }
          - { label: "Agent role", name: "agentRole", widget: "string" }
          - { label: "Agent bio", name: "agentBio", widget: "text" }
          - { label: "About — eyebrow", name: "aboutEyebrow", widget: "string" }
          - { label: "About — title", name: "aboutTitle", widget: "string" }
          - { label: "About — paragraphs", name: "aboutParagraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
          - { label: "Services — eyebrow", name: "servicesEyebrow", widget: "string" }
          - { label: "Services — title", name: "servicesTitle", widget: "string" }
          - { label: "Services — paragraph", name: "servicesLede", widget: "text" }
          - label: "Services — items"
            name: "services"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "FAQ teaser — eyebrow", name: "faqTeaserEyebrow", widget: "string" }
          - { label: "FAQ teaser — title", name: "faqTeaserTitle", widget: "string" }
          - { label: "FAQ teaser — paragraph", name: "faqTeaserLede", widget: "text" }
          - { label: "Contact — eyebrow", name: "contactEyebrow", widget: "string" }
          - { label: "Contact — title", name: "contactTitle", widget: "string" }
          - { label: "Contact — paragraph", name: "contactLede", widget: "text" }
          - { label: "Footer — brand tagline", name: "footerTagline", widget: "text" }
